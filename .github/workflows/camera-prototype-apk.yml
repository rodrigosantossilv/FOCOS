name: Build Camera Prototype APK
on:
  workflow_dispatch:
  push:
    branches: [feature/camera-mlkit-prototipo]
    paths:
      - 'prototipo-camera-mlkit/**'
      - '.github/workflows/camera-prototype-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipo-camera-mlkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ContadorPecas-Camera-debug
          path: prototipo-camera-mlkit/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
