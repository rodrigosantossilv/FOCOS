name: Validar YOLOv8 Android (publicação bloqueada)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar modelo treinado
        run: |
          test -s app/src/main/assets/parts_yolov8.onnx || { echo "::error::Modelo parts_yolov8.onnx ausente. Treine e adicione o modelo antes de gerar APK."; exit 1; }
      - name: Compilar somente para validação
        run: gradle --no-daemon :app:assembleDebug
# Publicação em Releases intencionalmente desativada até teste de inferência.
