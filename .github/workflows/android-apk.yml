name: FOCOS - Validar Android YOLOv8
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar projeto Android
        run: gradle --no-daemon :app:assembleDebug
      - name: Exigir modelo real antes de liberar APK
        run: |
          if [ ! -s app/src/main/assets/parts_yolov8.onnx ]; then
            echo "::error::YOLOv8 treinado ausente: não publicar APK sem contagem funcional."
            exit 1
          fi
          echo "Modelo encontrado; ainda é necessário validar inferência e precisão antes da publicação."
# Releases intencionalmente desabilitados até testes com o modelo treinado.
