name: Gerar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Preparar arquivo APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FOCOS-v2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FOCOS-APK
          path: FOCOS-v2.0.apk
          if-no-files-found: error
      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0 >/dev/null 2>&1; then
            gh release upload v2.0 FOCOS-v2.0.apk --clobber
          else
            gh release create v2.0 FOCOS-v2.0.apk --title "FOCOS v2.0" --notes "Contador offline com fundo adaptativo, estimativa de itens encostados, edição manual e temas. Versão experimental." --latest
          fi
