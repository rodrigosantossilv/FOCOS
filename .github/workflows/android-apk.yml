name: Validar integração Android (sem publicar APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar código para validar integração
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar presença do modelo treinado
        run: |
          test -s app/src/main/assets/pecas_yolov8.tflite || { echo "Modelo ausente: APK não será publicado."; exit 1; }
